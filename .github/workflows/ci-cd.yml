name: CI/CD DevSecOps Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      front_tag:
        description: 'Tag de la release Front à déployer'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write

jobs:
  audit-security:
    name: Security Scan (SAST & Secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trufflehog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
        continue-on-error: true

  build-and-test:
    name: Compilation & Integration Tests
    runs-on: ubuntu-latest
    needs: audit-security
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ⚡ CONFIGURATION DE BUILDX (Requis pour le cache Docker)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 📦 RÉCUPÉRATION DU FRONT-END DEPUIS L'AUTRE REPO
      - name: 📥 Fetch Front-End Release Artifact
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        run: |
          TAG_TO_FETCH="${{ github.event.inputs.front_tag || 'latest' }}"
          echo "🔍 Tentative de récupération du Front-End (Tag: $TAG_TO_FETCH)..."

          # 1. Choix de l'URL de l'API en fonction du tag
          if [ "$TAG_TO_FETCH" = "latest" ]; then
            API_URL="https://api.github.com/repos/AngelPASTORROJAS/CollectorShopFront/releases/latest"
          else
            API_URL="https://api.github.com/repos/AngelPASTORROJAS/CollectorShopFront/releases/tags/$TAG_TO_FETCH"
          fi

          # 2. Récupération de l'URL de l'asset avec authentification (évite le Rate Limit)
          ASSET_URL=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" $API_URL | jq -r '.assets[]? | select(.name=="dist.tar.gz") | .browser_download_url')

          # 3. Sécurité si l'asset n'est pas trouvé (on tente un repli sur la toute dernière release stable)
          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "⚠️ Tag ou asset introuvable sur l'URL spécifiée. Repli sur la dernière release générale..."
            ASSET_URL=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/AngelPASTORROJAS/CollectorShopFront/releases/latest | jq -r '.assets[]? | select(.name=="dist.tar.gz") | .browser_download_url')
          fi

          # 4. Vérification finale avant téléchargement
          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "❌ Erreur : Impossible de trouver l'asset dist.tar.gz sur le dépôt Front-End."
            exit 1
          fi

          # 5. Téléchargement et extraction
          echo "📥 Téléchargement de l'architecture Front-End..."
          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o dist.tar.gz "$ASSET_URL"

          mkdir -p CollectorShopApi/wwwroot/public
          tar -xzf dist.tar.gz -C CollectorShopApi/wwwroot/public --strip-components=1

          echo "✅ Front-end injecté avec succès dans wwwroot/public !"

      - name: 💾 Cache Docker layers for Compose
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-compose-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-compose-

      - name: Run Infrastructure & Integration Tests via Docker Compose
        env:
          DB_USER: myuser
          DB_PASSWORD: mypassword
          JWT_SECRET: UneCleSuperSecrèteEtTresLonguePourLeHachageDuJwt123456!
          # On indique à Buildx d'utiliser le dossier de cache pour docker-compose
          BUILDX_NO_DEFAULT_LOAD: 1
        run: |
          export DOCKER_BUILDKIT=1
          docker compose build --build-arg BUILDKIT_INLINE_CACHE=1
          docker compose up --exit-code-from api.tests --abort-on-container-exit
        continue-on-error: true

      - name: Shutdown Containers
        if: always()
        run: docker compose down -v

      # ==========================================
      # 🐳 CD : BUILD & PUSH DOCKER IMAGE
      # ==========================================
      - name: 🔐 Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build and Push Docker Image (With Cache)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./CollectorShopApi/Dockerfile
          push: true
          tags: |
            ghcr.io/angelpastorrojas/collectorshop/collector-shop-api:latest
            ghcr.io/angelpastorrojas/collectorshop/collector-shop-api:${{ github.event.inputs.front_tag || 'latest' }}
          # ⚡ LE CACHE MAGIQUE DE GITHUB ACTIONS (gha)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🚀 Deploy to VPS via SSH
        if: false
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /app/collector-shop
            docker compose pull
            docker compose up -d --remove-orphans
            echo "🚀 Application mise à jour en production !"
