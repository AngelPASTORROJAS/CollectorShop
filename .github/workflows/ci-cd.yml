name: CI/CD DevSecOps Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  audit-security:
    name: Security Scan (SAST & Secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trufflehog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
        continue-on-error: true

  build-and-test:
    name: Compilation & Integration Tests
    runs-on: ubuntu-latest
    needs: audit-security
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Infrastructure & Integration Tests via Docker Compose
        env:
          DB_USER: myuser
          DB_PASSWORD: mypassword
          JWT_SECRET: UneCleSuperSecrèteEtTresLonguePourLeHachageDuJwt123456!
        run: |
          docker compose up --build --exit-code-from api.tests
        continue-on-error: true

      - name: Shutdown Containers
        if: always()
        run: docker compose down -v
