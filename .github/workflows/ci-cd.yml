name: CI/CD DevSecOps Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  audit-security:
      name: Security Scan (SAST & Secrets)
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Run Trufflehog Secret Scan
          uses: trufflesecurity/trufflehog@main
          with:
            path: ./
            extra_args: --scanned-from-gitbranch
          continue-on-error: true

  build-and-test:
    name: Compilation & Integration Tests
    runs-on: ubuntu-latest
    needs: audit-security
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Verify Code Compilation
        run: dotnet build --no-restore --configuration Release

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Run Infrastructure & Integration Tests via Docker Compose
        run: |
          docker-compose up --build

      - name: Shutdown Containers
        if: always()
        run: docker-compose down -v
