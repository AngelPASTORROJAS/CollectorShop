name: CI/CD DevSecOps Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      front_tag:
        description: 'Tag de la release Front à déployer'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write

jobs:
  audit-security:
    name: Security Scan (SAST & Secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trufflehog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
        continue-on-error: true

  build-and-test:
    name: Compilation & Integration Tests
    runs-on: ubuntu-latest
    needs: audit-security
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 📦 RÉCUPÉRATION DU FRONT-END DEPUIS L'AUTRE REPO
      - name: 📥 Fetch Front-End Release Artifact
        if: github.event_name == 'workflow_dispatch'
        run: |
          # 1. Récupération de l'URL de téléchargement de l'asset dist.tar.gz
          ASSET_URL=$(curl -s https://api.github.com/repos/AngelPASTORROJAS/CollectorShopFront/releases/tags/${{ github.event.inputs.front_tag }} | jq -r '.assets[] | select(.name=="dist.tar.gz") | .browser_download_url')

          # 2. Téléchargement
          curl -L -o dist.tar.gz "$ASSET_URL"

          # 3. Extraction directement dans wwwroot/public
          mkdir -p CollectorShopApi/wwwroot/public
          tar -xzf dist.tar.gz -C CollectorShopApi/wwwroot/public --strip-components=1

          echo "✅ Front-end injecté avec succès dans wwwroot/public !"

      - name: Run Infrastructure & Integration Tests via Docker Compose
        env:
          DB_USER: myuser
          DB_PASSWORD: mypassword
          JWT_SECRET: UneCleSuperSecrèteEtTresLonguePourLeHachageDuJwt123456!
        run: |
          docker compose up --build --exit-code-from api.tests --abort-on-container-exit
        continue-on-error: true

      - name: Shutdown Containers
        if: always()
        run: docker compose down -v

      # ==========================================
      # 🐳 CD : BUILD & PUSH DOCKER IMAGE
      # ==========================================
      - name: 🔐 Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build and Push Docker Image
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./CollectorShopApi/Dockerfile
          push: true
          tags: |
            ghcr.io/angelpastorrojas/collectorshop/collector-shop-api:latest
            ghcr.io/angelpastorrojas/collectorshop/collector-shop-api:${{ github.event.inputs.front_tag || 'latest' }}

      - name: 🚀 Deploy to VPS via SSH
        if: false # github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /app/collector-shop
            docker compose pull
            docker compose up -d --remove-orphans
            echo "🚀 Application mise à jour en production !"
