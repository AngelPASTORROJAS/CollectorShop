# Common Blocked Ports
# Browsers block a specific list of ports to prevent cross-protocol exploits and malicious probing. Key restricted ports include:
  # 6000: X11 display server
  # 20-21: FTP data and access
  # 22: SSH
  # 109-110: POP2 and POP3
  # 6566: SANE port
  # 10080: Amanda

services:
  # =========================================================================
  # MOTEUR DE MIGRATION (S'exécute, applique le SQL brut puis s'arrête en Succès)
  # =========================================================================
  database.migrator:
    image: ${DOCKER_REGISTRY-}database-migrator
    build:
      context: .
      dockerfile: 05_Database/DataBasePostgreSql/Dockerfile
    environment:
      # Injection des chaînes de connexion pointant vers les conteneurs du réseau Docker
      - DB_USERS_CONNECTION=Host=collectorshop-users-postgres;Port=5432;Database=users_db;Username=myuser;Password=mypassword;
      - DB_FINANCE_CONNECTION=Host=collectorshop-finance-postgres;Port=5434;Database=finance_db;Username=myuser;Password=mypassword;
    depends_on:
      users.database:
        condition: service_healthy
      finance.database:
        condition: service_healthy

  # API GRAND PUBLIC
  collectorshopapi:
    image: ${DOCKER_REGISTRY-}collectorshopapi
    build:
      context: .
      dockerfile: CollectorShopApi/Dockerfile
    environment:
      - ASPNETCORE_URLS=https://+:5001;http://+:5000
      - StorageSettings__StorageFolder=/app/user_documents # On indique à l'API d'écrire dans le dossier monté par le volume Docker
    ports:
      - "5000:5000"
      - "5001:5001"
    volumes:
      - csharp_document_storage:/app/user_documents # On monte le volume partagé dans le dossier de l'API
    depends_on:
      users.database:
        condition: service_healthy
      collector.database:
        condition: service_healthy
      finance.database:
        condition: service_healthy
      database.migrator:
        condition: service_started # service_completed_successfully # L'API n'écoute pas tant que les scripts SQL ne sont pas appliqués !

  # API ADMINISTRATION (BACKOFFICE)
  collectorshopadmin:
    image: ${DOCKER_REGISTRY-}collectorshopadmin
    build:
      context: .
      dockerfile: CollectorShopAdmin/Dockerfile
    environment:
      - ASPNETCORE_URLS=https://+:5004;http://+:5003
      - StorageSettings__StorageFolder=/app/user_documents # Edition/Suppression de fichier par modération humaine
    ports:
      - "5003:5003"
      - "5004:5004"
    volumes:
      - csharp_document_storage:/app/user_documents # Partage le même dossier d'images
    depends_on:
      - finance.database

  # ==========================================
  # 1. BULLE IDENTITÉ & RGPD (Données Personnelles)
  # ==========================================
  users.database:
    image: postgres:17-bookworm
    container_name: collectorshop-users-postgres
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: users_db
    ports:
      - "5432:5432"
    volumes:
      - users_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d users_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. BULLE MÉTIER PUBLIC (Catalogue & Trafic Masse)
  # ==========================================
  collector.database:
    image: postgres:17-bookworm
    container_name: collectorshop-collector-postgres
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: collector_db
    ports:
      - "5433:5433"
    volumes:
      - collector_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d collector_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 3. BULLE HAUTE SÉCURITÉ (Finance, Commission, Audit)
  # ==========================================
  finance.database:
    image: postgres:17-bookworm
    container_name: collectorshop-finance-postgres
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: finance_db  # Héberge logiquement les schémas Trading (5%) et Audit Logs
    ports:
      - "5434:5434"
    volumes:
      - finance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d finance_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # OUTILLAGE DE SUPERVISION DES BASES
  # ==========================================
  adminer:
    image: adminer
    container_name: collectorshop-adminer
    restart: always
    ports:
      - "5431:8080"
    depends_on:
      users.database:
        condition: service_healthy
      collector.database:
        condition: service_healthy
      finance.database:
        condition: service_healthy

# Déclaration des volumes persistants pour éviter la perte de données au redémarrage
volumes:
  users_postgres_data:
  collector_postgres_data:
  finance_postgres_data:
  csharp_document_storage: # C'est ce volume qui centralise TOUTES les images de TOUTES les instances d'API