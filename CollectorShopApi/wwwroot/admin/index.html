<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CollectorShop - Administration (Test)</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #f9f6f7;
            color: #2d132c;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid #801336;
        }

        h1 {
            color: #801336;
            margin-top: 0;
        }

        button {
            background: #801336;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

            button:hover {
                background: #ee4540;
            }

        pre {
            background: #f9f6f7;
            padding: 12px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 14px;
        }

        .badge {
            background: #fce4ec;
            color: #880e4f;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>CollectorShop <span class="badge">BackOffice Admin</span></h1>
        <p>Si vous voyez cette page, le routage de la route <code>/admin</code> vers <code>wwwroot/admin/</code> fonctionne parfaitement.</p>

        <button onclick="testApi()">Tester l'API (/configuration)</button>
        <p>Réponse de l'API :</p>
        <pre id="output">Cliquez sur le bouton pour tester...</pre>

        <p><a href="/">← Retour au site public</a></p>
    </div>

    <script>
        async function testApi() {
            const output = document.getElementById('output');
            try {
                output.textContent = "Appel en cours...";
                // L'appel fonctionne de manière relative car nous sommes sur le même port !
                const response = await fetch('/configuration');
                if (!response.ok) throw new Error(`Erreur HTTP: ${response.status}`);
                const data = await response.json();
                output.textContent = JSON.stringify(data, null, 2);
            } catch (err) {
                output.textContent = `Erreur : ${err.message}`;
            }
        }
    </script>
</body>
</html>
